[package]
name = "s288-host"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { version = "0.6.3", features = ["desktop"] }
serialport = "4.7.3"
tokio = { version = "1.48.0", features = ["time"] }

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Correct the opaque Objective-C class declaration used by the macOS backend.
[patch.crates-io]
block = { path = "vendor/block" }
